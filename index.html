<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#bfe3ff">
<title>Last Mile</title>
<style>
  :root { --paper: #fffaf0; --hot: #ff7a1a; --ok: #3dff7a; --pick: #ffa31a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; color: var(--paper);
    font: 600 15px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas#c, canvas#lines { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  canvas#lines { pointer-events: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .panel { background: rgba(16,21,28,.55); border-radius: 12px; padding: 7px 10px; text-shadow: none; }

  #order { top: max(10px, env(safe-area-inset-top)); left: calc(max(12px, env(safe-area-inset-left)) + 54px); min-width: 210px; max-width: 290px; }
  #order .phase { font-size: 11px; letter-spacing: .08em; font-weight: 800; }
  #order .phase.pickup { color: var(--pick); } #order .phase.dropoff { color: var(--ok); }
  #order .where { font-size: 16px; font-weight: 800; margin: 1px 0 3px; }
  #order .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
  #otime { font-size: 22px; font-weight: 900; }
  #otime.warn { color: #ffd27a; } #otime.late { color: #ff7a7a; }
  #otip { font-size: 14px; color: #b7ffcf; }
  #spill { margin-top: 5px; display: none; align-items: center; gap: 6px; font-size: 11px; }
  #spill .bar { flex: 1; height: 7px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  #spill .bar span { display: block; height: 100%; width: 100%; background: #7fd8ff; }
  #stopping { height: 4px; margin-top: 5px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  #stopping span { display: block; height: 100%; width: 0; background: #fff; }

  #shiftbar { top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center; font-variant-numeric: tabular-nums; }
  #clock { font-size: 18px; font-weight: 900; }
  #money { font-size: 14px; }
  #rating { font-size: 13px; color: #ffe07a; }
  #turn { top: calc(max(10px, env(safe-area-inset-top)) + 72px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; }
  #turn .arrow { font-size: 34px; line-height: 1; width: 40px; text-align: center; font-weight: 900; }
  #turn .dist { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  #turn .onto { font-size: 12px; opacity: .85; }
  #turn.soon { background: rgba(40,220,255,.55); }
  #map { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 132px; height: 132px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,.6); background: rgba(16,21,28,.5); pointer-events: none; border-radius: 50%; }

  #speed { bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); text-align: center; }
  #kmh { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  #kmh small { font-size: 12px; opacity: .8; }
  #gear { font-size: 11px; color: #ffd27a; height: 13px; }
  #pedhud { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 4px; font-size: 10px; letter-spacing: .05em; }
  #pedhud .pb { width: 46px; height: 7px; background: rgba(0,0,0,.35); border-radius: 4px; overflow: hidden; }
  #pedhud .pb span { display: block; height: 100%; width: 0; }
  #pbT { background: #5fdc78; } #pbB { background: #ff6a5a; }
  #wbar { position: relative; width: 60px; height: 7px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,255,255,.15), rgba(255,255,255,.4) 50%, rgba(255,255,255,.15)); }
  #wbar i { position: absolute; top: -3px; width: 6px; height: 13px; margin-left: -3px; border-radius: 3px; background: #ffd27a; left: 50%; }
  #cond { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 10px; margin-top: 4px; }
  #cond .bar { width: 80px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden; }
  #cond .bar span { display: block; height: 100%; width: 100%; background: #9ee08a; }

  #toast { top: 47%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: 900; opacity: 0; transition: opacity .3s; text-align: center; white-space: pre-line; }
  #toast.show { opacity: 1; transition: none; }
  #toast small { display: block; font-size: 15px; font-weight: 700; }

  /* controls */
  #zone { position: fixed; left: 0; top: 0; bottom: 0; width: 58%; touch-action: none; }
  #zone .hint { position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%); opacity: .55; font-size: 13px; pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
  #pedal { position: fixed; right: max(22px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); height: 150px; width: 92px;
    border-radius: 20px; border: 3px solid rgba(255,255,255,.7); touch-action: none; overflow: hidden;
    background: linear-gradient(to bottom, rgba(60,200,90,.6) 0%, rgba(60,200,90,.6) 10%, rgba(60,200,90,.3) 38%,
      rgba(255,190,40,.45) 38%, rgba(255,190,40,.45) 60%, rgba(230,60,50,.3) 60%, rgba(230,60,50,.65) 90%, rgba(230,60,50,.65) 100%); }
  #pedal .lab { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 11px; line-height: 1; letter-spacing: .06em; pointer-events: none; text-shadow: 0 1px 0 rgba(0,0,0,.45); }
  #pedal .gas { top: 15%; } #pedal .both { top: 45%; } #pedal .brk { top: 76%; }
  #pedal i { position: absolute; left: 0; right: 0; height: 4px; margin-top: -2px; background: #fff; display: none; box-shadow: 0 0 6px #fff; }
  .hidden-btn { display: none; }
  #pause { position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); width: 44px; height: 44px; border-radius: 10px;
    background: rgba(16,21,28,.45); border: 2px solid rgba(255,255,255,.6); color: #fff; font-size: 18px; }
  #knob { position: fixed; pointer-events: none; display: none; }
  #knob .ring { position: absolute; border: 2px solid rgba(255,255,255,.55); border-radius: 50%; }
  #knob .dot { position: absolute; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: rgba(255,255,255,.75); }
  #knob .rail { position: absolute; height: 6px; margin-top: -3px; border-radius: 3px; background: rgba(255,255,255,.35); }

  /* menu */
  #menu { position: fixed; inset: 0; background: rgba(16,21,28,.8); display: grid; place-items: center; overflow: auto; padding: 16px; }
  #menu.hidden { display: none; }
  .card { width: min(720px, 100%); }
  h1 { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: .02em; }
  h1 small { font-size: 14px; font-weight: 600; opacity: .7; letter-spacing: 0; margin-left: 8px; }
  .muted { opacity: .78; font-weight: 500; font-size: 13px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 8px; }
  .mode { padding: 8px 10px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; text-align: left; font: inherit; }
  .mode b { display: block; font-size: 16px; }
  .mode span { font-size: 12px; font-weight: 500; opacity: .8; }
  .mode.sel { border-color: var(--hot); background: rgba(255,122,26,.18); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 13px; }
  .row input[type=range] { flex: 1; min-width: 140px; accent-color: var(--hot); }
  button.go { padding: 12px 26px; font: 800 18px system-ui, sans-serif; border-radius: 12px; border: 0; background: var(--hot); color: #fff; }
  button.sm { padding: 7px 12px; font: 700 13px system-ui, sans-serif; border-radius: 9px; border: 2px solid rgba(255,255,255,.4); background: transparent; color: #fff; }
  #msg { color: #ffd27a; font-size: 13px; min-height: 1em; margin: 4px 0; }
  #summary { margin: 8px 0; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); display: none; }
  #summary h2 { margin: 0 0 4px; font-size: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.12); }
  th:first-child, td:first-child { text-align: left; }
  details summary { cursor: pointer; font-size: 13px; opacity: .85; margin: 6px 0; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
  .stats div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 6px 10px; }
  .stats b { display: block; font-size: 18px; }
  .stats span { font-size: 11px; opacity: .75; letter-spacing: .04em; }
  .shop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0; }
  .mod { border-radius: 12px; padding: 8px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.15); display: flex; flex-direction: column; gap: 4px; }
  .mod .tag { font-size: 10px; letter-spacing: .08em; opacity: .7; }
  .mod .tag.perf { color: #7fd8ff; } .mod .tag.cargo { color: #b7ffcf; } .mod .tag.silly { color: #ff9be0; }
  .mod b { font-size: 14px; }
  .mod .d { font-size: 11px; font-weight: 500; opacity: .85; flex: 1; }
  .mod button { padding: 6px; border-radius: 8px; border: 0; background: var(--hot); color: #fff; font: 800 13px system-ui, sans-serif; }
  .mod button:disabled { background: rgba(255,255,255,.15); color: rgba(255,255,255,.5); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 8px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,.12); }
  .repair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0; font-size: 13px; }
  .repair .bar { width: 120px; height: 9px; border-radius: 5px; background: rgba(0,0,0,.4); overflow: hidden; }
  .repair .bar span { display: block; height: 100%; }
  h2.big { font-size: 26px; margin: 0 0 2px; }
  @media (max-width: 700px) { .shop { grid-template-columns: repeat(2, 1fr); } }
  @media (max-height: 480px) { h1 { font-size: 26px; } .mode { padding: 6px 9px; } .mode b { font-size: 14px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="lines"></canvas>
<div id="zone"><div class="hint" id="zonehint">slide to steer</div></div>
<div id="knob"><div class="rail"></div><div class="ring"></div><div class="dot"></div></div>
<div id="pedal"><span class="lab gas">GAS</span><span class="lab both">BOTH</span><span class="lab brk">BRAKE</span><i></i></div>
<button class="hidden-btn" id="drift"></button><button class="hidden-btn" id="brake"></button>
<button id="pause" aria-label="Menu">❚❚</button>

<div class="hud panel" id="order">
  <div class="phase" id="ophase">PICK UP</div>
  <div class="where" id="owhere">–</div>
  <div class="row"><span id="otime">0:00</span><span id="otip"></span></div>
  <div id="spill"><span>🥤</span><div class="bar"><span></span></div></div>
  <div id="stopping"><span></span></div>
</div>
<div class="hud" id="shiftbar"><div id="clock">6:00</div><div id="money">$0.00</div><div id="rating">★ 4.80</div></div>
<div class="hud panel" id="turn"><div class="arrow" id="tarrow">↑</div><div><div class="dist" id="tdist">–</div><div class="onto" id="tonto"></div></div></div>
<canvas id="map" width="264" height="264"></canvas>
<div class="hud" id="speed">
  <div id="gear"></div>
  <div id="kmh">0 <small>km/h</small></div>
  <div id="pedhud"><div class="pb"><span id="pbB"></span></div><span>F</span><div id="wbar"><i></i></div><span>R</span><div class="pb"><span id="pbT"></span></div></div>
  <div id="cond"><span>CAR</span><div class="bar"><span></span></div></div>
</div>
<div class="hud" id="toast"></div>

<div id="menu">
  <div class="card">
    <div id="screen"></div>
    <details id="settings"><summary>Controls</summary>
      <div class="modes" id="modes"></div>
      <div class="row">Range <input type="range" id="dragRange" min="30" max="140" step="5"> <span id="dragRangeV"></span>
        Centre <input type="range" id="dragDead" min="0" max="0.3" step="0.02"> <span id="dragDeadV"></span></div>
      <div class="row">Curve <input type="range" id="dragCurve" min="1" max="2.2" step="0.1"> <span id="dragCurveV"></span>
        Pedal height <input type="range" id="pedalH" min="80" max="260" step="10"> <span id="pedalHV"></span></div>
      <div class="row">Volume <input type="range" id="volume" min="0" max="1" step="0.05"> <span id="volumeV"></span></div>
      <div class="muted">Keys: A/D steer, W gas, S brake (hold S when stopped to reverse), R unstick, Esc menu. <a href="track.html" style="color:#ffd27a">Test track</a></div>
    </details>
  </div>
</div>
<script type="module" src="/src/city/main.js"></script>
</body>
</html>
